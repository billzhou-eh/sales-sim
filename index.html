  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ─── Utilities ───────────────────────────────────────────────────────────

    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // ─── API Utilities ───────────────────────────────────────────────────────

    // Groq uses the OpenAI-compatible chat completions format
    const GROQ_BASE = 'https://api.groq.com/openai/v1';
    const GROQ_MODEL_FAST   = 'llama-3.3-70b-versatile';  // customer conversation
    const GROQ_MODEL_COACH  = 'llama-3.3-70b-versatile';  // coaching narrative

    async function callClaudeStream(messages, systemPrompt, apiKey, onChunk) {
      // System prompt becomes the first message in OpenAI format
      const groqMessages = [
        { role: 'system', content: systemPrompt },
        ...messages
      ];

      const res = await fetch(`${GROQ_BASE}/chat/completions`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: GROQ_MODEL_FAST,
          max_tokens: 280,
          messages: groqMessages,
          stream: true
        })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `API error ${res.status}`);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let full = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6).trim();
          if (data === '[DONE]') continue;
          try {
            const parsed = JSON.parse(data);
            const delta = parsed.choices?.[0]?.delta?.content;
            if (delta) { full += delta; onChunk(full); }
          } catch (_) {}
        }
      }
      return full;
    }

    async function generateCoaching(scenario, persona, choicesMade, totalScore, maxScore, apiKey) {
      const prompt = buildCoachingPrompt(scenario, persona, choicesMade, totalScore, maxScore);
      const res = await fetch(`${GROQ_BASE}/chat/completions`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: GROQ_MODEL_COACH,
          max_tokens: 400,
          messages: [{ role: 'user', content: prompt }]
        })
      });
      if (!res.ok) throw new Error(`Coaching API error ${res.status}`);
      const data = await res.json();
      return data.choices[0].message.content;
    }

    async function generateDynamicChoices(persona, scenario, messages, stage, apiKey) {
      const prompt = buildChoiceGeneratorPrompt(persona, scenario, messages, stage);
      const res = await fetch(`${GROQ_BASE}/chat/completions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
        body: JSON.stringify({ model: GROQ_MODEL_FAST, max_tokens: 700, messages: [{ role: 'user', content: prompt }] })
      });
      if (!res.ok) throw new Error(`Choice gen error ${res.status}`);
      const data = await res.json();
      let text = data.choices[0].message.content.trim();
      // Strip markdown code fences if the model includes them
      text = text.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '');
      const parsed = JSON.parse(text);
      if (!parsed.choices || !Array.isArray(parsed.choices) || parsed.choices.length !== 3) {
        throw new Error('Unexpected choices format');
      }
      return parsed.choices;
    }

    // ─── Offline (no-API) helpers ─────────────────────────────────────────────

    // Pick one of the pre-written customer replies for a choice (random for variety)
    function getOfflineReply(scenarioId, stageId, choice) {
      const byScenario = (typeof OFFLINE_REPLIES !== 'undefined') ? OFFLINE_REPLIES[scenarioId] : null;
      const pool = byScenario && byScenario[stageId] && byScenario[stageId][choice.id];
      if (pool && pool.length) return pool[Math.floor(Math.random() * pool.length)];
      // Fallback if a reply is missing: a neutral line shaped by choice quality
      if (choice.quality === 'excellent') return 'That is a good question. Let me think about that.';
      if (choice.quality === 'good') return 'Alright. Go on.';
      return 'Hm. I am not sure that helps me right now.';
    }

    // Reveal a fixed string progressively, to match the AI "typing" feel
    function simulateStream(text, onChunk) {
      return new Promise(resolve => {
        const words = text.split(' ');
        let i = 0;
        const step = () => {
          i += Math.max(1, Math.round(words.length / 22)); // ~22 ticks total
          const shown = words.slice(0, i).join(' ');
          onChunk(shown);
          if (i >= words.length) { onChunk(text); resolve(text); }
          else setTimeout(step, 45);
        };
        step();
      });
    }

    // Build the 3-line coaching locally from the choices made (no API needed)
    function buildOfflineCoaching(scenario, choicesMade) {
      const labelFor = c => {
        const t = (typeof getTypeMeta === 'function') ? getTypeMeta(c.type).label : c.type;
        return t;
      };
      // Strongest move: best choice, prefer implication/need-payoff
      const ranked = [...choicesMade].map((c, i) => ({ c, i }))
        .sort((a, b) => {
          const w = q => q === 'excellent' ? 2 : q === 'good' ? 1 : 0;
          const bonus = t => t === 'needpayoff' ? 0.3 : t === 'implication' ? 0.2 : 0;
          return (w(b.c.quality) + bonus(b.c.type)) - (w(a.c.quality) + bonus(a.c.type));
        });
      const best = ranked[0];
      const worst = ranked[ranked.length - 1];

      let strongest;
      if (best && best.c.quality !== 'poor') {
        strongest = `Your ${labelFor(best.c).toLowerCase()} in "${scenario.stages[best.i].title}" was your best move.`;
      } else {
        strongest = 'You stayed engaged, but no single move developed the customer\'s real problem.';
      }

      let miss;
      const prematurePitch = choicesMade.find((c, i) => c.type === 'solution' && c.quality === 'poor');
      if (prematurePitch) {
        miss = 'You pitched a solution before the customer felt the problem.';
      } else if (worst && worst.c.quality === 'poor') {
        miss = `Your move in "${scenario.stages[worst.i].title}" lost ground — too vague or off-topic.`;
      } else if (worst && worst.c.quality === 'good') {
        miss = 'A few choices were safe but did not develop the problem deeply.';
      } else {
        miss = 'Very few weak moves — keep this discipline.';
      }

      const usedImplication = choicesMade.some(c => c.type === 'implication' && c.quality === 'excellent');
      const usedNeedpayoff = choicesMade.some(c => c.type === 'needpayoff' && c.quality === 'excellent');
      let tryNext;
      if (prematurePitch) {
        tryNext = 'Ask an implication question (the cost or effect of the problem) before you propose anything.';
      } else if (!usedImplication) {
        tryNext = 'Add an implication question — ask what the problem costs or affects — to make it feel urgent.';
      } else if (!usedNeedpayoff) {
        tryNext = 'Use a need-payoff question — ask what solving it would be worth — so the customer states the value.';
      } else {
        tryNext = 'Keep developing the problem with questions before moving to a next step.';
      }

      return `Strongest move: ${strongest}\nBiggest miss: ${miss}\nTry next: ${tryNext}`;
    }

    // ─── localStorage helpers ────────────────────────────────────────────────

    const APP_VERSION = '1.0.0'; // see README "Versioning" section
    const STORAGE_KEY = 'ehss_progress_v1';
    const API_KEY_KEY = 'ehss_apikey';
    const ADMIN_KEY_KEY = 'ehss_admin_key'; // set by admin; users never need to enter their own key
    const MODE_KEY = 'ehss_mode'; // 'offline' | 'ai'  (default offline)
    const TUTORIAL_KEY = 'ehss_tutorial_seen';

    function loadProgress() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
      catch { return {}; }
    }

    function saveScenarioResult(scenarioId, score, maxScore, grade) {
      const p = loadProgress();
      const prev = p[scenarioId];
      p[scenarioId] = {
        score, maxScore, grade,
        completedAt: new Date().toISOString(),
        bestScore: prev ? Math.max(prev.bestScore || 0, score) : score
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
    }

            setTimeout(() => onSave(val.trim()), 900);

            setTestResult('invalid');
          }

          setTestResult('error');
        }
        setTesting(false);

        onSave(val.trim());

                    </svg>

              </p>
              <div className="relative mb-3">
                <input

                  placeholder="gsk_..."

                <button

              {testResult === 'error' && (

                Get a key at <span className="font-medium">console.groq.com</span>

      );

                            className="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-eh-500"
                          />
                          <button onClick={() => setShowKey(v => !v)} className="px-3 py-2 text-xs text-gray-500 border border-gray-300 rounded-lg hover:bg-gray-50">
                            {showKey ? 'Hide' : 'Show'}
                          </button>
                        </div>
                        {localStorage.getItem(ADMIN_KEY_KEY) && (
                          <p className="text-xs text-green-600 mt-1">A key is currently active for all users.</p>
                        )}
                      </div>

                      <div className="flex gap-2">
                        <button onClick={handleTest} disabled={!keyVal.trim() || testing}
                          className="flex-1 border border-gray-300 text-gray-700 rounded-lg py-2 text-sm font-medium hover:bg-gray-50 disabled:opacity-40 transition-colors">
                          {testing ? 'Testing…' : 'Test Key'}
                        </button>
                        <button onClick={handleSave} disabled={!keyVal.trim() || saved}
                          className="flex-1 bg-magenta-500 text-white rounded-lg py-2 text-sm font-semibold hover:bg-magenta-600 disabled:opacity-40 transition-colors">
                          {saved ? '✓ Saved!' : 'Save & Activate'}
                        </button>
                      </div>

                      {testResult === 'valid' && <div className="flex items-center gap-2 text-sm text-green-700 bg-green-50 rounded-lg px-3 py-2"><span>✓</span> Key is valid — ready to save.</div>}
                      {testResult === 'invalid' && <div className="flex items-center gap-2 text-sm text-red-700 bg-red-50 rounded-lg px-3 py-2"><span>✗</span> Invalid key — check it and try again.</div>}
                      {testResult === 'error' && <div className="flex items-center gap-2 text-sm text-amber-700 bg-amber-50 rounded-lg px-3 py-2"><span>⚠</span> Connection error — check your internet.</div>}

                      {localStorage.getItem(ADMIN_KEY_KEY) && (
                        <button onClick={handleClear} className="w-full text-sm text-red-500 hover:text-red-700 py-1 transition-colors">
                          Remove admin key (users will need their own key)
                        </button>
                      )}
                      <p className="text-xs text-gray-400 text-center">Key is stored in your browser only. Set it on each device, or deploy via GitHub Pages.</p>
                    </div>
                  )}

                  {tab === 'changelog' && (
                    <div className="overflow-y-auto max-h-96 space-y-5 pr-1">
                      {CHANGELOG.map((release, i) => (
                        <div key={release.version} className="relative pl-5 border-l-2 border-gray-200">
                          <div className="absolute -left-[7px] top-1 w-3 h-3 rounded-full bg-white border-2 border-eh-500" />
                          <div className="flex items-baseline gap-2 mb-1">
                            <span className="text-sm font-bold text-gray-900">{release.version}</span>
                            <span className="text-xs text-gray-400">{release.date}</span>
                            {i === 0 && <span className="text-xs font-semibold bg-eh-500 text-white px-1.5 py-0.5 rounded-full">Latest</span>}
                          </div>
                          <p className="text-xs font-semibold text-gray-600 mb-2">{release.label}</p>
                          <ul className="space-y-1.5">
                            {release.entries.map((e, j) => (
                              <li key={j} className="flex items-start gap-2 text-xs text-gray-600">
                                <span className={`mt-0.5 flex-shrink-0 text-[10px] font-semibold px-1.5 py-0.5 rounded ${typeStyle[e.type]}`}>{typeLabel[e.type]}</span>
                                <span>{e.text}</span>
                              </li>
                            ))}
                          </ul>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ─── Tutorial Modal ──────────────────────────────────────────────────────

    const TUTORIAL_STEPS = [
      {
        icon: '🎯',
        title: 'Practice real sales conversations',
        body: 'You play the sales rep. The customer is simulated — realistic, guarded, and not volunteering their real problem. Your goal: ask the right questions to uncover their pain, then earn a next step.',
      },
      {
        icon: '🗂️',
        title: '6 stages, 3 choices each',
        body: 'Every scenario has 6 conversation stages — opening, probing, developing the problem, quantifying impact, need-payoff, and close. At each stage you pick one of three responses. Choose carefully.',
        note: 'The scenario ends after your 6th choice. There is no extra time.',
      },
      {
        icon: '🔒',
        title: 'Your score is hidden until the end',
        body: 'Each choice is scored in the background — excellent, good, or poor. You won\'t see points during the conversation. Focus on the customer, not the scoreboard. The full debrief appears after stage 6.',
      },
      {
        icon: '🌀',
        title: 'Use SPIN — don\'t pitch early',
        body: 'The sim follows the SPIN method: surface the Situation → name the Problem → develop the Implication (what it costs) → guide toward the Need-Payoff (what solving it is worth). Pitching a solution before the customer feels the problem will cost you points.',
      },
    ];

    function TutorialModal({ onClose }) {
      const [step, setStep] = useState(0);
      const isLast = step === TUTORIAL_STEPS.length - 1;
      const s = TUTORIAL_STEPS[step];

      function handleClose() {
        localStorage.setItem(TUTORIAL_KEY, '1');
        onClose();
      }

      return (
        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md fade-in">
            <div className="p-6">
              {/* Step indicator */}
              <div className="flex justify-center gap-1.5 mb-6">
                {TUTORIAL_STEPS.map((_, i) => (
                  <button key={i} onClick={() => setStep(i)}
                    className={`h-1.5 rounded-full transition-all ${i === step ? 'w-6 bg-eh-500' : 'w-1.5 bg-gray-200 hover:bg-gray-300'}`}
                  />
                ))}
              </div>

              {/* Content */}
              <div className="text-center mb-6">
                <div className="text-5xl mb-4">{s.icon}</div>
                <h2 className="text-xl font-bold text-gray-900 mb-3">{s.title}</h2>
                <p className="text-sm text-gray-600 leading-relaxed">{s.body}</p>
                {s.note && (
                  <div className="mt-3 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 text-xs text-amber-800 text-left">
                    <strong>Note:</strong> {s.note}
                  </div>
                )}
              </div>

              {/* Navigation */}
              <div className="flex gap-2">
                {step > 0 && (
                  <button onClick={() => setStep(s => s - 1)}
                    className="px-4 py-2 text-sm text-gray-500 hover:text-gray-700 rounded-lg hover:bg-gray-100 transition-colors">
                    Back
                  </button>
                )}
                <button
                  onClick={isLast ? handleClose : () => setStep(s => s + 1)}
                  className="flex-1 bg-magenta-500 text-white rounded-lg py-2.5 text-sm font-semibold hover:bg-magenta-600 transition-colors"
                >
                  {isLast ? 'Start playing →' : 'Next'}
                </button>
              </div>

              {!isLast && (
                <button onClick={handleClose} className="w-full mt-2 text-xs text-gray-400 hover:text-gray-600 py-1 transition-colors">
                  Skip tutorial
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ─── Home Screen ─────────────────────────────────────────────────────────

    function DifficultyBadge({ level }) {
      const isBDM = level === 'BDM';
      return (
        <span className={`text-xs font-semibold px-2 py-0.5 rounded-full ${isBDM ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}`}>
          {level === 'BDM' ? 'BDM' : 'SC'}
        </span>
      );
    }

    function ProductBadge({ product }) {
      const isNetilion = product.toLowerCase().includes('netilion');
      const isBoth = product.toLowerCase().includes('+');
      return (
        <span className={`text-xs font-semibold px-2 py-0.5 rounded-full ${
          isBoth ? 'bg-teal-100 text-teal-700' :
          isNetilion ? 'bg-magenta-100 text-magenta-700' :
          'bg-eh-100 text-eh-700'
        }`}>
          {product}
        </span>
      );
    }

    function HomeScreen({ onStart, onSetApiKey, apiKey, adminKeySet, mode, onSetMode, progress, onShowTutorial, onShowAdmin }) {
      const [filter, setFilter] = useState('all');

      const PERSONA_IDS = Object.keys(PERSONAS);
      const filtered = SCENARIOS.filter(s => {
        if (filter === 'fx') return s.productLine === 'fieldxpert';
        if (filter === 'netilion') return s.productLine === 'netilion' || s.productLine === 'both';
        if (PERSONA_IDS.includes(filter)) return s.personaId === filter;
        return true;
      });

      return (
        <div className="min-h-screen">
          {/* Header — white with 4px cyan top strip (E+H identity element) */}
          <div className="bg-white border-b border-gray-200" style={{borderTop: '4px solid #009EE3'}}>
            <div className="max-w-6xl mx-auto px-6 py-3">
              <div className="flex items-center justify-between gap-4">
                <div className="flex items-center gap-3 min-w-0">
                  <div className="w-9 h-9 bg-eh-500 rounded flex items-center justify-center text-xs font-bold text-white flex-shrink-0">E+H</div>
                  <div className="min-w-0">
                    <h1 className="text-lg font-bold leading-tight text-gray-900">DS Sales Simulator <span className="text-gray-400 text-xs font-normal align-middle">v{APP_VERSION}</span></h1>
                    <p className="text-gray-500 text-xs mt-0.5 hidden sm:block">Practice sales discovery — learn to ask the right questions</p>
                  </div>
                </div>
                <div className="flex items-center gap-2 flex-shrink-0">
                  {/* Mode toggle */}
                  <div className="flex items-center bg-gray-100 rounded-lg p-0.5 text-xs">
                    <button
                      onClick={() => onSetMode('offline')}
                      className={`px-2.5 py-1 rounded-md transition-colors ${mode === 'offline' ? 'bg-white text-gray-900 font-semibold shadow-sm' : 'text-gray-500 hover:text-gray-800'}`}
                      title="Pre-written replies. No key or internet needed."
                    >
                      Offline
                    </button>
                    <button
                      onClick={() => onSetMode('ai')}
                      className={`px-2.5 py-1 rounded-md transition-colors ${mode === 'ai' ? 'bg-white text-gray-900 font-semibold shadow-sm' : 'text-gray-500 hover:text-gray-800'}`}
                      title="Live AI replies via Groq. Needs an API key and internet."
                    >
                      Live AI
                    </button>
                  </div>
                  {mode === 'ai' && !adminKeySet && (
                    <button
                      onClick={onSetApiKey}
                      className={`hidden sm:flex items-center gap-2 text-xs px-3 py-1.5 rounded-lg border transition-colors flex-shrink-0 ${
                        apiKey ? 'border-gray-300 text-gray-500 hover:bg-gray-50' : 'border-magenta-500 text-magenta-600 hover:bg-magenta-50 font-medium'
                      }`}
                    >
                      <span>{apiKey ? '✓' : '🔑'}</span>
                      {apiKey ? 'Key Set' : 'Add Key'}
                    </button>
                  )}
                  {/* Help button */}
                  <button
                    onClick={onShowTutorial}
                    className="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200 transition-colors flex-shrink-0"
                    title="How to play"
                  >
                    <span className="text-sm font-bold">?</span>
                  </button>
                  {/* Admin button */}
                  <button
                    onClick={onShowAdmin}
                    className="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200 transition-colors flex-shrink-0"
                    title="Admin dashboard"
                  >
                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>

          {/* Filter tabs */}
          <div className="max-w-6xl mx-auto px-6 pt-4 pb-2">
            <div className="flex gap-2 flex-wrap">
              {[
                { key: 'all', label: 'All Scenarios' },
                { key: 'fx', label: 'Field Xpert' },
                { key: 'netilion', label: 'Netilion' },
                ...Object.values(PERSONAS).map(p => ({ key: p.id, label: p.name.split(' ')[0] }))
              ].map(f => (
                <button
                  key={f.key}
                  onClick={() => setFilter(f.key)}
                  className={`px-4 py-1.5 rounded-full text-sm font-medium transition-colors ${
                    filter === f.key
                      ? 'bg-gray-900 text-white'
                      : 'bg-white text-gray-600 hover:bg-gray-100 border border-gray-200'
                  }`}
                >
                  {f.label}
                </button>
              ))}
            </div>
          </div>

          {/* Scenario cards — 3-column on large screens */}
          <div className="max-w-6xl mx-auto px-6 pb-6 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
            {filtered.map(scenario => {
              const persona = PERSONAS[scenario.personaId];
              const result = progress[scenario.id];
              const canStart = mode === 'offline' || !!apiKey;

              return (
                <div
                  key={scenario.id}
                  className={`bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden transition-shadow flex flex-col ${canStart ? 'hover:shadow-md cursor-pointer' : ''}`}
                  onClick={() => canStart && onStart(scenario)}
                >
                  <div className={`h-1 ${
                    scenario.productLine === 'netilion' ? 'bg-magenta-500' :
                    scenario.productLine === 'both' ? 'bg-teal-500' :
                    'bg-eh-500'
                  }`} />

                  <div className="p-4 flex flex-col flex-1">
                    {/* Badges row */}
                    <div className="flex items-center justify-between mb-2">
                      <div className="flex gap-1.5 flex-wrap">
                        <ProductBadge product={scenario.product} />
                        <DifficultyBadge level={scenario.difficulty} />
                        {result && (
                          <span className="text-xs font-bold px-2 py-0.5 rounded-full"
                            style={{ background: getGradeBg(result.grade), color: getGradeColor(result.grade) }}>
                            {result.grade}
                          </span>
                        )}
                      </div>
                      <span className="text-xs text-gray-400 flex-shrink-0">{scenario.estimatedMinutes}m</span>
                    </div>

                    <h3 className="font-semibold text-gray-900 text-sm mb-0.5">{scenario.title}</h3>
                    <p className="text-xs text-gray-500 mb-3">{scenario.subtitle}</p>

                    {/* Persona chip */}
                    <div className="flex items-center gap-2 mb-3 flex-1">
                      <div className="w-7 h-7 rounded-full flex items-center justify-center text-white text-xs font-bold flex-shrink-0"
                        style={{ background: persona.avatarColor }}>
                        {persona.initials}
                      </div>
                      <div className="min-w-0">
                        <div className="text-xs font-medium text-gray-800">{persona.name}</div>
                        <div className="text-xs text-gray-400 truncate">{persona.role} · {persona.location}</div>
                      </div>
                    </div>

                    <button
                      onClick={e => { e.stopPropagation(); canStart && onStart(scenario); }}
                      disabled={!canStart}
                      className={`w-full py-2 rounded-lg text-sm font-semibold transition-colors ${
                        canStart
                          ? 'bg-gray-900 text-white hover:bg-gray-800'
                          : 'bg-gray-100 text-gray-400 cursor-not-allowed'
                      }`}
                    >
                      {!canStart ? '🔑 Add API Key to Start' : result ? `Play Again  (Best: ${result.bestScore}/${result.maxScore})` : 'Start Scenario →'}
                    </button>
                  </div>
                </div>
              );
            })}
          </div>

          {mode === 'offline' && (
            <div className="max-w-6xl mx-auto px-6 pb-8">
              <div className="bg-eh-50 border border-eh-200 rounded-xl p-4 flex items-center gap-3">
                <span className="text-xl">📋</span>
                <div>
                  <div className="text-sm font-semibold text-eh-800">Offline mode — ready to play, no key or internet needed</div>
                  <div className="text-sm text-eh-700">The customer uses realistic pre-written replies. Switch to <strong>Live AI</strong> (top right) for dynamic replies if you have a Groq key and network access.</div>
                </div>
              </div>
            </div>
          )}

          {mode === 'ai' && !apiKey && !adminKeySet && (
            <div className="max-w-6xl mx-auto px-6 pb-8">
              <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 flex items-center gap-3">
                <span className="text-xl">🔑</span>
                <div>
                  <div className="text-sm font-semibold text-amber-800">Live AI needs a Groq API key</div>
                  <div className="text-sm text-amber-700">Add a key (free at console.groq.com), or switch to <strong>Offline</strong> mode to play without one.</div>
                </div>
                <button onClick={onSetApiKey} className="ml-auto flex-shrink-0 bg-amber-500 text-white text-sm font-semibold px-4 py-2 rounded-lg hover:bg-amber-600 transition-colors">
                  Add Key
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─── Scenario Briefing ───────────────────────────────────────────────────

    function ScenarioBriefing({ scenario, onStart, onBack }) {
      const persona = PERSONAS[scenario.personaId];

      return (
        <div className="min-h-screen pb-24">
          <div className="max-w-3xl mx-auto px-4 py-6">
            <button onClick={onBack} className="flex items-center gap-1.5 text-sm text-gray-500 hover:text-gray-800 mb-6 transition-colors">
              <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
              </svg>
              Back to Scenarios
            </button>

            <div className="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden mb-4">
              <div className={`h-2 ${
                scenario.productLine === 'netilion' ? 'bg-magenta-500' :
                scenario.productLine === 'both' ? 'bg-teal-500' :
                'bg-eh-500'
              }`} />
              <div className="p-6">
                <div className="flex gap-2 mb-3 flex-wrap">
                  <ProductBadge product={scenario.product} />
                  <DifficultyBadge level={scenario.difficulty} />
                  <span className="text-xs text-gray-400 self-center">~{scenario.estimatedMinutes} min</span>
                </div>
                <h1 className="text-2xl font-bold text-gray-900 mb-1">{scenario.title}</h1>
                <p className="text-gray-500 text-base mb-6">{scenario.subtitle}</p>

                <div className="grid sm:grid-cols-2 gap-4 mb-6">
                  <div className="bg-blue-50 rounded-xl p-4">
                    <div className="text-xs font-semibold text-blue-600 uppercase tracking-wide mb-2">Your Objectives</div>
                    <div className="space-y-2">
                      {scenario.objectives.map((obj, i) => (
                        <div key={i} className="flex items-start gap-2.5">
                          <span className="w-4 h-4 rounded-full bg-blue-200 text-blue-800 text-xs flex items-center justify-center font-bold flex-shrink-0 mt-0.5">{i + 1}</span>
                          <span className="text-sm text-blue-900">{obj}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                  <div className="bg-gray-50 rounded-xl p-4">
                    <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Situation</div>
                    <div className="text-sm text-gray-700 leading-relaxed">{scenario.context}</div>
                  </div>
                </div>
              </div>
            </div>

            {/* Customer profile */}
            <div className="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 mb-6">
              <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-4">You'll Be Talking To</div>
              <div className="flex items-start gap-4">
                <div
                  className="w-14 h-14 rounded-2xl flex items-center justify-center text-white text-lg font-bold flex-shrink-0"
                  style={{ background: persona.avatarColor }}
                >
                  {persona.initials}
                </div>
                <div className="flex-1 min-w-0">
                  <div className="font-semibold text-gray-900 text-lg">{persona.name}</div>
                  <div className="text-gray-500 text-sm">{persona.role}</div>
                  <div className="text-gray-400 text-sm">{persona.company} · {persona.location}</div>
                </div>
              </div>
              <div className="mt-4 grid sm:grid-cols-2 gap-3">
                <div>
                  <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">What You Know Going In</div>
                  <ul className="space-y-1">
                    {(scenario.knownGoingIn || []).map((p, i) => (
                      <li key={i} className="text-xs text-gray-600 flex items-start gap-1.5">
                        <span className="text-eh-400 mt-0.5">•</span>{p}
                      </li>
                    ))}
                  </ul>
                </div>
                <div>
                  <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Personality</div>
                  <p className="text-xs text-gray-600 leading-relaxed">{persona.personality}</p>
                </div>
              </div>
            </div>

            <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-sm text-amber-800">
              <strong>Your mission:</strong> This customer won&apos;t hand you their real problem. Ask the right questions to uncover their latent pain — and don&apos;t pitch before they feel it. Pitch too early and they&apos;ll cool off.
            </div>
          </div>

          {/* Sticky begin button — always visible */}
          <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-10">
            <div className="max-w-3xl mx-auto px-4 py-3 flex items-center gap-4">
              <div className="hidden sm:block text-xs text-gray-500">
                <span className="font-medium text-gray-700">{scenario.stages.length} decision points</span> · ~{scenario.estimatedMinutes} min
              </div>
              <button
                onClick={() => onStart(scenario)}
                className="flex-1 bg-magenta-500 text-white py-3 rounded-xl font-semibold text-base hover:bg-magenta-600 active:bg-magenta-700 transition-colors"
              >
                Begin Simulation →
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ─── Chat Bubble ─────────────────────────────────────────────────────────

    function ChatBubble({ role, text, persona, isStreaming }) {
      const isCustomer = role === 'customer';
      return (
        <div className={`flex gap-3 fade-in ${isCustomer ? '' : 'flex-row-reverse'}`}>
          {isCustomer ? (
            <div
              className="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold flex-shrink-0 mt-1"
              style={{ background: persona.avatarColor }}
            >
              {persona.initials}
            </div>
          ) : (
            <div className="w-8 h-8 rounded-full bg-eh-500 flex items-center justify-center text-white text-xs font-bold flex-shrink-0 mt-1">
              You
            </div>
          )}
          <div className={`max-w-[78%] rounded-2xl px-4 py-3 text-sm leading-relaxed ${
            isCustomer
              ? 'bg-white border border-gray-200 text-gray-800 rounded-tl-sm'
              : 'bg-eh-500 text-white rounded-tr-sm'
          } ${isStreaming ? 'streaming-cursor' : ''}`}>
            {text || (isStreaming ? '' : '...')}
          </div>
        </div>
      );
    }

    // ─── Choice Panel ─────────────────────────────────────────────────────────

    function ChoicePanel({ stage, onChoose, chosen, disabled, revealRationale }) {
      const labels = ['A', 'B', 'C', 'D'];
      return (
        <div className="fade-in">
          <div className="flex items-center gap-2 mb-3">
            <div className="w-2 h-2 rounded-full bg-eh-500" />
            <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide">{stage.title}</div>
          </div>
          {stage.instruction && (
            <p className="text-sm text-gray-600 mb-3 bg-gray-50 rounded-lg px-3 py-2 border border-gray-200">{stage.instruction}</p>
          )}
          {chosen && !revealRationale && (
            <div className="mb-2 text-xs text-gray-400 italic animate-pulse-soft">Waiting for response…</div>
          )}
          <div className="space-y-2">
            {stage.choices.map((choice, idx) => {
              const isChosen = chosen && chosen.id === choice.id;
              const showResult = !!chosen && revealRationale;
              let borderColor = 'border-gray-200';
              let bg = 'bg-white';
              let textColor = 'text-gray-800';
              if (showResult && isChosen) {
                if (choice.quality === 'excellent') { borderColor = 'border-green-400'; bg = 'bg-green-50'; }
                else if (choice.quality === 'good')  { borderColor = 'border-amber-400'; bg = 'bg-amber-50'; }
                else                                  { borderColor = 'border-red-400';   bg = 'bg-red-50';   }
              } else if (isChosen && !revealRationale) {
                borderColor = 'border-eh-400'; bg = 'bg-eh-50';
              } else if (chosen && !isChosen) {
                borderColor = 'border-gray-100'; bg = 'bg-gray-50'; textColor = 'text-gray-400';
              }

              const circleClass = showResult && isChosen
                ? choice.quality === 'excellent' ? 'border-green-500 bg-green-500 text-white'
                  : choice.quality === 'good'    ? 'border-amber-500 bg-amber-500 text-white'
                  :                                'border-red-500 bg-red-500 text-white'
                : isChosen
                  ? 'border-eh-500 bg-eh-500 text-white'
                  : 'border-gray-300 text-gray-400';

              const circleContent = showResult && isChosen
                ? choice.quality === 'excellent' ? '✓' : choice.quality === 'good' ? '~' : '✗'
                : labels[idx];

              return (
                <button
                  key={choice.id}
                  onClick={() => !disabled && !chosen && onChoose(choice)}
                  disabled={disabled || !!chosen}
                  className={`choice-card w-full text-left rounded-xl border-2 px-4 py-3 transition-all ${borderColor} ${bg} ${
                    !chosen && !disabled ? 'hover:border-eh-400 hover:bg-eh-50 cursor-pointer' : 'cursor-default'
                  } ${chosen && !isChosen ? 'opacity-40' : ''}`}
                >
                  <div className="flex items-start gap-3">
                    <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 mt-0.5 text-xs font-bold transition-colors ${circleClass}`}>
                      {circleContent}
                    </div>
                    <div className="flex-1 min-w-0">
                      <p className={`text-sm leading-relaxed ${textColor}`}>{choice.text}</p>
                      {isChosen && revealRationale && (
                        <div className="mt-2 pt-2 border-t border-current/10 fade-in">
                          <div className="flex items-center gap-1.5 flex-wrap mb-1">
                            <span
                              className="text-xs font-semibold px-2 py-0.5 rounded-full"
                              style={{ background: getQualityBg(choice.quality), color: getQualityColor(choice.quality) }}
                            >
                              {getQualityLabel(choice.quality)}
                            </span>
                            {choice.type && (
                              <span
                                className="text-xs font-semibold px-2 py-0.5 rounded-full"
                                style={{ background: getTypeMeta(choice.type).bg, color: getTypeMeta(choice.type).color }}
                              >
                                {getTypeMeta(choice.type).label}
                              </span>
                            )}
                          </div>
                          <p className="text-xs text-gray-600 leading-relaxed">{choice.rationale}</p>
                        </div>
                      )}
                    </div>
                  </div>
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    // ─── Score Tracker ────────────────────────────────────────────────────────

    function ScoreTracker({ currentStage, totalStages, scenarioTitle }) {
      const pct = totalStages > 0 ? (currentStage / totalStages) * 100 : 0;
      return (
        <div className="bg-white border-b border-gray-200 sticky top-0 z-10">
          <div className="max-w-3xl mx-auto px-4 py-2.5 flex items-center gap-4">
            <div className="flex-1 min-w-0">
              <div className="text-xs text-gray-600 font-medium truncate">{scenarioTitle}</div>
              <div className="text-xs text-gray-500">Stage {currentStage} of {totalStages}</div>
            </div>
            <div className="w-28 bg-gray-100 rounded-full h-2">
              <div
                className="h-2 rounded-full bg-eh-500 transition-all duration-500"
                style={{ width: `${pct}%` }}
              />
            </div>
          </div>
        </div>
      );
    }

    // ─── Results Summary ─────────────────────────────────────────────────────

    function ResultsSummary({ scenario, choicesMade, score, maxScore, grade, coachingText, loadingCoaching, onHome, onRetry }) {
      const persona = PERSONAS[scenario.personaId];

      return (
        <div className="min-h-screen bg-gray-50">
          <div className="max-w-3xl mx-auto px-4 py-8">
            {/* Grade card */}
            <div className="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 mb-4 text-center fade-in">
              <div className="text-sm text-gray-500 mb-2">Simulation Complete</div>
              <div
                className="text-7xl font-black mb-2"
                style={{ color: getGradeColor(grade) }}
              >
                {grade}
              </div>
              <div className="text-gray-600 text-sm mb-1">{getGradeLabel(grade)}</div>
              <div className="text-2xl font-bold text-gray-900 mt-3">{score} <span className="text-base font-normal text-gray-400">out of {maxScore} points</span></div>
              <div className="text-sm text-gray-400">{Math.round(score / maxScore * 100)}%</div>
            </div>

            {/* AI Coaching */}
            <div className="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 mb-4">
              <div className="flex items-center gap-2 mb-3">
                <div className="w-8 h-8 bg-eh-500 rounded-lg flex items-center justify-center">
                  <svg className="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.347.814A4 4 0 0112 20a4 4 0 01-3.769-2.672l-.347-.814z" />
                  </svg>
                </div>
                <div className="font-semibold text-gray-900">Sales Coach Feedback</div>
              </div>
              {loadingCoaching ? (
                <div className="animate-pulse-soft text-sm text-gray-400">Generating your personalised coaching...</div>
              ) : (
                <div className="space-y-2">
                  {(() => {
                    const meta = {
                      'Strongest move': { icon: '✓', color: '#16a34a', bg: '#f0fdf4' },
                      'Biggest miss':   { icon: '✕', color: '#dc2626', bg: '#fef2f2' },
                      'Try next':       { icon: '→', color: '#2563eb', bg: '#eff6ff' }
                    };
                    const lines = (coachingText || '').split('\n').map(l => l.trim()).filter(Boolean);
                    const parsed = lines.map(line => {
                      const idx = line.indexOf(':');
                      if (idx === -1) return { label: null, text: line };
                      const label = line.slice(0, idx).trim().replace(/^[-•*]\s*/, '');
                      return { label, text: line.slice(idx + 1).trim() };
                    });
                    if (!parsed.some(p => meta[p.label])) {
                      return <p className="text-sm text-gray-700 leading-relaxed">{coachingText}</p>;
                    }
                    return parsed.map((p, i) => {
                      const m = meta[p.label];
                      if (!m) return <p key={i} className="text-sm text-gray-700 leading-relaxed">{p.text}</p>;
                      return (
                        <div key={i} className="flex items-start gap-2.5 rounded-lg px-3 py-2" style={{ background: m.bg }}>
                          <span className="text-sm font-bold mt-0.5" style={{ color: m.color }}>{m.icon}</span>
                          <div className="text-sm">
                            <span className="font-semibold" style={{ color: m.color }}>{p.label}: </span>
                            <span className="text-gray-700">{p.text}</span>
                          </div>
                        </div>
                      );
                    });
                  })()}
                </div>
              )}
            </div>

            {/* Discovery technique summary */}
            {(() => {
              const implications = choicesMade.filter(c => c.type === 'implication' && c.quality === 'excellent').length;
              const needpayoffs = choicesMade.filter(c => c.type === 'needpayoff' && c.quality === 'excellent').length;
              const prematurePitches = choicesMade.filter(c => c.type === 'solution' && c.quality === 'poor').length;
              return (
                <div className="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 mb-4">
                  <div className="font-semibold text-gray-900 mb-3">Discovery Technique</div>
                  <div className="grid grid-cols-3 gap-3">
                    <div className="text-center bg-magenta-50 rounded-xl p-3">
                      <div className="text-2xl font-bold text-magenta-700">{implications}</div>
                      <div className="text-xs text-magenta-600 mt-0.5">Implication Qs landed</div>
                    </div>
                    <div className="text-center bg-teal-50 rounded-xl p-3">
                      <div className="text-2xl font-bold text-teal-700">{needpayoffs}</div>
                      <div className="text-xs text-teal-600 mt-0.5">Need-Payoff Qs landed</div>
                    </div>
                    <div className="text-center bg-red-50 rounded-xl p-3">
                      <div className="text-2xl font-bold text-red-700">{prematurePitches}</div>
                      <div className="text-xs text-red-600 mt-0.5">Premature pitches</div>
                    </div>
                  </div>
                  <p className="text-xs text-gray-500 mt-3 leading-relaxed">
                    Top performers develop latent pain with implication and need-payoff questions <em>before</em> proposing a solution. Premature pitches are the most common discovery mistake.
                  </p>
                </div>
              );
            })()}

            {/* Stage-by-stage breakdown */}
            <div className="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 mb-6">
              <div className="font-semibold text-gray-900 mb-4">Decision Breakdown</div>
              <div className="space-y-3">
                {choicesMade.map((choice, i) => {
                  const stage = scenario.stages[i];
                  return (
                    <div key={i} className="flex items-start gap-3 pb-3 border-b border-gray-100 last:border-0 last:pb-0">
                      <div
                        className="w-6 h-6 rounded-full flex items-center justify-center text-white text-xs font-bold flex-shrink-0 mt-0.5"
                        style={{ background: getQualityColor(choice.quality) }}
                      >
                        {i + 1}
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center justify-between gap-2">
                          <div className="text-xs font-medium text-gray-700">{stage.title}</div>
                          <div className="flex items-center gap-1.5 flex-shrink-0">
                            {choice.type && (
                              <span className="text-xs font-semibold px-2 py-0.5 rounded-full"
                                style={{ background: getTypeMeta(choice.type).bg, color: getTypeMeta(choice.type).color }}>
                                {getTypeMeta(choice.type).label}
                              </span>
                            )}
                            <span className="text-xs font-semibold px-2 py-0.5 rounded-full"
                              style={{ background: getQualityBg(choice.quality), color: getQualityColor(choice.quality) }}>
                              +{choice.points}
                            </span>
                          </div>
                        </div>
                        <div className="text-xs text-gray-600 mt-1 leading-relaxed italic">“{choice.text}”</div>
                        <div className="text-xs text-gray-500 mt-1 leading-relaxed">{choice.rationale}</div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="flex gap-3">
              <button
                onClick={onHome}
                className="flex-1 py-3 rounded-xl border border-gray-300 text-gray-700 text-sm font-semibold hover:bg-gray-50 transition-colors"
              >
                Back to Home
              </button>
              <button
                onClick={onRetry}
                className="flex-1 py-3 rounded-xl bg-magenta-500 text-white text-sm font-semibold hover:bg-magenta-600 transition-colors"
              >
                Try Again
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ─── Simulation Screen ────────────────────────────────────────────────────

    function SimulationScreen({ scenario, apiKey, mode, onComplete, onBack }) {
      const persona = PERSONAS[scenario.personaId];
      const systemPrompt = buildSystemPrompt(persona, scenario);
      const useAI = mode === 'ai' && !!apiKey;

      // Shuffle each stage's choices once on mount — prevents always-pick-A pattern
      const [shuffledStages] = useState(() =>
        scenario.stages.map(stage => ({
          ...stage,
          choices: shuffleArray([...stage.choices])
        }))
      );

      const [messages, setMessages] = useState([
        { role: 'customer', text: scenario.customerOpening }
      ]);
      const [stageIndex, setStageIndex] = useState(0);
      const [chosenThisStage, setChosenThisStage] = useState(null);
      const [allChoices, setAllChoices] = useState([]);
      const [score, setScore] = useState(0);
      const [phase, setPhase] = useState('waiting'); // waiting | responding | done
      const [streamingText, setStreamingText] = useState('');
      const [error, setError] = useState(null);
      // Dynamic choices (AI mode only) — null while generating, array when ready
      const [dynamicChoices, setDynamicChoices] = useState(null);
      const [generatingChoices, setGeneratingChoices] = useState(false);
      const chatEndRef = useRef(null);
      const maxScore = calculateMaxScore(scenario);
      const currentStage = shuffledStages[stageIndex];

      // Fetch AI-generated choices for a given stage index
      async function fetchDynamicChoices(stageIdx, currentMessages) {
        setGeneratingChoices(true);
        setDynamicChoices(null);
        try {
          const stage = shuffledStages[stageIdx];
          const choices = await generateDynamicChoices(persona, scenario, currentMessages, stage, apiKey);
          setDynamicChoices(choices);
        } catch (e) {
          // Fallback: use the static choices for that stage
          setDynamicChoices(shuffledStages[stageIdx].choices);
        } finally {
          setGeneratingChoices(false);
        }
      }

      // Generate choices for stage 0 as soon as the simulation opens (AI mode only)
      useEffect(() => {
        if (useAI) {
          fetchDynamicChoices(0, [{ role: 'customer', text: scenario.customerOpening }]);
        }
      }, []);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, streamingText, phase]);

      async function handleChoose(choice) {
        if (phase !== 'waiting') return;
        setChosenThisStage(choice);
        setPhase('responding');
        setError(null);

        const newScore = score + choice.points;
        setScore(newScore);

        const updatedChoices = [...allChoices, choice];
        setAllChoices(updatedChoices);

        // Build conversation history (used in AI mode only)
        const history = messages.map(m => ({
          role: m.role === 'customer' ? 'assistant' : 'user',
          content: m.text
        }));
        history.push({ role: 'user', content: choice.text });

        setStreamingText('');

        const advance = (fullResponse) => {
          const newMessages = [
            ...messages,
            { role: 'user', text: choice.text },
            { role: 'customer', text: fullResponse }
          ];
          setMessages(newMessages);
          setStreamingText('');

          const isLastStage = stageIndex >= scenario.stages.length - 1;
          if (isLastStage) {
            setPhase('done');
            setTimeout(() => onComplete(updatedChoices, newScore, maxScore), 900);
          } else {
            const nextIdx = stageIndex + 1;
            // Brief pause so the user can read the reply; no scoring shown during play.
            setTimeout(() => {
              setPhase('waiting');
              setStageIndex(nextIdx);
              setChosenThisStage(null);
            }, 1600);
            // Generate choices for the next stage while the customer reply is being read
            if (useAI) {
              fetchDynamicChoices(nextIdx, newMessages);
            }
          }
        };

        try {
          let fullResponse;
          if (useAI) {
            // Live AI; if the call fails (firewall/limit), fall back to a scripted reply.
            try {
              fullResponse = await callClaudeStream(history, systemPrompt, apiKey, (chunk) => setStreamingText(chunk));
            } catch (apiErr) {
              fullResponse = await simulateStream(getOfflineReply(scenario.id, currentStage.id, choice), (chunk) => setStreamingText(chunk));
            }
          } else {
            // Offline mode: pre-written reply with a typing effect, no API call.
            fullResponse = await simulateStream(getOfflineReply(scenario.id, currentStage.id, choice), (chunk) => setStreamingText(chunk));
          }
          advance(fullResponse);
        } catch (err) {
          setStreamingText('');
          setError(err.message);
          setPhase('waiting');
          setChosenThisStage(null);
          setScore(score); // revert
          setAllChoices(allChoices); // revert
        }
      }

      return (
        <div className="flex flex-col h-screen" style={{background:'#E6ECF0'}}>
          {/* Sticky progress bar (no score shown during play) */}
          <ScoreTracker
            currentStage={stageIndex + 1}
            totalStages={scenario.stages.length}
            scenarioTitle={scenario.title}
          />

          {/* Back button */}
          <div className="max-w-3xl w-full mx-auto px-4 pt-3">
            <button onClick={onBack} className="flex items-center gap-1 text-xs text-gray-400 hover:text-gray-600 transition-colors">
              <svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
              </svg>
              Exit scenario
            </button>
          </div>

          {/* Chat area */}
          <div className="flex-1 overflow-y-auto chat-scroll">
            <div className="max-w-3xl mx-auto px-4 py-4 space-y-4">
              {/* Persona header */}
              <div className="flex items-center gap-3 pb-2 border-b border-gray-200">
                <div
                  className="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-sm"
                  style={{ background: persona.avatarColor }}
                >
                  {persona.initials}
                </div>
                <div>
                  <div className="font-semibold text-gray-900 text-sm">{persona.name}</div>
                  <div className="text-xs text-gray-500">{persona.role} · {persona.company}</div>
                </div>
                <div className="ml-auto">
                  <div className="w-2 h-2 rounded-full bg-green-400 animate-pulse" />
                </div>
              </div>

              {/* Messages */}
              {messages.map((msg, i) => (
                <ChatBubble key={i} role={msg.role} text={msg.text} persona={persona} />
              ))}

              {/* Streaming response */}
              {phase === 'responding' && (
                <ChatBubble role="customer" text={streamingText} persona={persona} isStreaming={true} />
              )}

              {/* Error */}
              {error && (
                <div className="bg-red-50 border border-red-200 rounded-xl px-4 py-3 text-sm text-red-700 fade-in">
                  <strong>API Error:</strong> {error}
                  <div className="mt-1 text-xs text-red-500">Check your API key and try your choice again.</div>
                </div>
              )}

              <div ref={chatEndRef} />
            </div>
          </div>

          {/* Choice panel — pinned to bottom, max 55% viewport height with scroll */}
          {phase !== 'done' && currentStage && (
            <div className="border-t border-gray-200 bg-white overflow-y-auto" style={{maxHeight:'55vh'}}>
              <div className="max-w-3xl mx-auto px-4 py-4">
                {useAI && generatingChoices && !dynamicChoices ? (
                  <div className="fade-in">
                    <div className="flex items-center gap-2 mb-3">
                      <div className="w-2 h-2 rounded-full bg-eh-500" />
                      <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide">{currentStage.title}</div>
                    </div>
                    <div className="flex items-center gap-2 text-sm text-gray-400 animate-pulse-soft py-4">
                      <svg className="w-4 h-4 animate-spin text-eh-400" fill="none" viewBox="0 0 24 24">
                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/>
                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
                      </svg>
                      Generating your response options…
                    </div>
                  </div>
                ) : (
                  <ChoicePanel
                    stage={useAI && dynamicChoices ? { ...currentStage, choices: dynamicChoices } : currentStage}
                    onChoose={handleChoose}
                    chosen={chosenThisStage}
                    disabled={phase === 'responding'}
                    revealRationale={false}
                  />
                )}
              </div>
            </div>
          )}

          {phase === 'done' && (
            <div className="border-t border-gray-200 bg-white p-4">
              <div className="max-w-3xl mx-auto text-center text-sm text-gray-500 animate-pulse-soft">
                Simulation complete — loading your results...
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─── App Root ─────────────────────────────────────────────────────────────

    function App() {
      const [screen, setScreen] = useState('home'); // home | briefing | simulation | results
      const [selectedScenario, setSelectedScenario] = useState(null);

      // Admin key takes priority — if set, users never need to enter their own key
      const adminKey = localStorage.getItem(ADMIN_KEY_KEY) || '';
      const [apiKey, setApiKey] = useState(adminKey || localStorage.getItem(API_KEY_KEY) || '');
      const adminKeySet = !!adminKey;

      const [showApiModal, setShowApiModal] = useState(false);
      const [showAdminPanel, setShowAdminPanel] = useState(new URLSearchParams(window.location.search).has('admin'));
      const [showTutorial, setShowTutorial] = useState(!localStorage.getItem(TUTORIAL_KEY));
      // If admin key is present, default to AI mode; otherwise respect saved preference
      const [mode, setMode] = useState(adminKey ? 'ai' : (localStorage.getItem(MODE_KEY) || 'offline'));
      const [progress, setProgress] = useState(loadProgress());
      const [results, setResults] = useState(null); // { choicesMade, score, maxScore, grade, coaching, loadingCoaching }

      function handleSetMode(m) {
        setMode(m);
        localStorage.setItem(MODE_KEY, m);
        // Switching to AI without a key prompts for one (only if no admin key)
        if (m === 'ai' && !apiKey && !adminKeySet) setShowApiModal(true);
      }

      function handleSaveApiKey(key) {
        setApiKey(key);
        setShowApiModal(false);
        if (key) { setMode('ai'); localStorage.setItem(MODE_KEY, 'ai'); }
      }

      function handleAdminClose(keySaved) {
        setShowAdminPanel(false);
        if (keySaved) {
          // Re-read the newly saved admin key and apply it
          const newKey = localStorage.getItem(ADMIN_KEY_KEY) || '';
          setApiKey(newKey);
          if (newKey) setMode('ai');
        }
      }

      function handleStartScenario(scenario) {
        setSelectedScenario(scenario);
        setScreen('briefing');
      }

      function handleBeginSimulation(scenario) {
        setScreen('simulation');
      }

      async function handleSimulationComplete(choicesMade, score, maxScore) {
        const grade = calculateGrade(score, maxScore);
        saveScenarioResult(selectedScenario.id, score, maxScore, grade);
        setProgress(loadProgress());

        setResults({ choicesMade, score, maxScore, grade, coaching: '', loadingCoaching: true });
        setScreen('results');

        // Offline mode (or no key): build coaching locally, no API call.
        if (mode !== 'ai' || !apiKey) {
          setResults(r => ({ ...r, coaching: buildOfflineCoaching(selectedScenario, choicesMade), loadingCoaching: false }));
          return;
        }
        // AI mode: try Groq; fall back to local coaching if it fails (firewall/limit).
        try {
          const persona = PERSONAS[selectedScenario.personaId];
          const coaching = await generateCoaching(selectedScenario, persona, choicesMade, score, maxScore, apiKey);
          setResults(r => ({ ...r, coaching, loadingCoaching: false }));
        } catch {
          setResults(r => ({ ...r, coaching: buildOfflineCoaching(selectedScenario, choicesMade), loadingCoaching: false }));
        }
      }

      function handleHome() {
        setScreen('home');
        setSelectedScenario(null);
        setResults(null);
      }

      function handleRetry() {
        setResults(null);
        setScreen('simulation');
      }

      return (
        <>
          {showApiModal && (
            <ApiKeyModal onSave={handleSaveApiKey} currentKey={apiKey} />
          )}
          {showAdminPanel && (
            <AdminPanel onClose={handleAdminClose} />
          )}
          {showTutorial && (
            <TutorialModal onClose={() => setShowTutorial(false)} />
          )}

          {screen === 'home' && (
            <HomeScreen
              onStart={handleStartScenario}
              onSetApiKey={() => setShowApiModal(true)}
              apiKey={apiKey}
              adminKeySet={adminKeySet}
              mode={mode}
              onSetMode={handleSetMode}
              progress={progress}
              onShowTutorial={() => setShowTutorial(true)}
              onShowAdmin={() => setShowAdminPanel(true)}
            />
          )}

          {screen === 'briefing' && selectedScenario && (
            <ScenarioBriefing
              scenario={selectedScenario}
              onStart={handleBeginSimulation}
              onBack={() => setScreen('home')}
            />
          )}

          {screen === 'simulation' && selectedScenario && (
            <SimulationScreen
              key={selectedScenario.id + (results ? 'retry' : 'first')}
              scenario={selectedScenario}
              apiKey={apiKey}
              mode={mode}
              onComplete={handleSimulationComplete}
              onBack={() => setScreen('briefing')}
            />
          )}

          {screen === 'results' && results && selectedScenario && (
            <ResultsSummary
              scenario={selectedScenario}
              choicesMade={results.choicesMade}
              score={results.score}
              maxScore={results.maxScore}
              grade={results.grade}
              coachingText={results.coaching}
              loadingCoaching={results.loadingCoaching}
              onHome={handleHome}
              onRetry={handleRetry}
            />
          )}
        </>
      );
    }

    // ─── Render ───────────────────────────────────────────────────────────────
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
